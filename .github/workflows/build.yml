name: Build and validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils gcc python3-tk xvfb xauth desktop-file-utils
          python3 -m pip install -r requirements.txt
      - name: Build Windows x64 DLL
        run: |
          cp version.dll build-committed.dll
          python3 src/build_hookfix.py original/version.dll
          cmp build-committed.dll version.dll
          rm build-committed.dll
      - name: Verify PE, exports and preserved Panacea code
        run: python3 tests/verify.py original/version.dll
      - name: Test forwarding ABI and concurrent calls
        run: |
          gcc -O2 -Wall -Wextra -Werror -pthread -I build tests/abi_harness.c -o build/abi_harness
          build/abi_harness version.dll
      - name: Test trampoline relocation, unwind and concurrent calls
        run: |
          gcc -O2 -Wall -Wextra -Werror -pthread -I build tests/hook_harness.c -o build/hook_harness
          build/hook_harness version.dll
      - name: Verify deterministic build
        run: |
          cp version.dll build/first-build.dll
          python3 src/build_hookfix.py original/version.dll
          cmp build/first-build.dll version.dll
      - name: Package DLL, sources, instructions and rollback
        run: python3 scripts/package.py
      - name: Test DroidDeck setup assistant
        run: |
          python3 -m unittest discover -s tests -p test_setup_assistant.py -v
          python3 -m unittest discover -s tests -p test_host_tools.py -v
          desktop-file-validate linux-setup/Panacea-Setup.desktop
          xvfb-run -a python3 tests/setup_gui_smoke.py
      - name: Test browser setup interface
        run: |
          npm install --prefix "$RUNNER_TEMP/panacea-browser-test" --no-audit --no-fund playwright@1.64.0
          export NODE_PATH="$RUNNER_TEMP/panacea-browser-test/node_modules"
          node "$NODE_PATH/playwright/cli.js" install --with-deps chromium
          node tests/setup_web_smoke.cjs
      - name: Check and package Linux setup scripts
        run: |
          for script in linux-setup/*.sh; do bash -n "$script"; done
          python3 scripts/package_linux_setup.py
          cmp dist/Panacea-ARM-Linux-Setup.zip packages/Panacea-ARM-Linux-Setup.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Panacea-ARM-x64
          if-no-files-found: error
          path: |
            version.dll
            dist/Panacea-ARM-x64.zip
            dist/Panacea-ARM-Linux-Setup.zip
            dist/Panacea-ARM-Linux-Setup.sha256
            dist/SHA256SUMS.txt
            dist/BUILD-MANIFEST.json
            dist/EXPORTS.txt

  native-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk xvfb xauth desktop-file-utils
          /usr/bin/python3 -m venv --system-site-packages build-native-venv
          build-native-venv/bin/pip install 'pyinstaller==6.22.3'
      - name: Build standalone ARM64 wizard
        run: |
          python3 scripts/package_linux_setup.py
          build-native-venv/bin/pyinstaller --noconfirm --clean --onedir --name Panacea-Setup --paths linux-setup/assistant --distpath dist --workpath build/native --specpath build linux-setup/assistant/native.py
          mkdir -p dist/Panacea-Setup/licenses
          for package in python3.12 libpython3.12-stdlib tcl8.6 tk8.6 libtcl8.6 libtk8.6; do
            cp "/usr/share/doc/$package/copyright" "dist/Panacea-Setup/licenses/$package.txt"
          done
          cp build-native-venv/lib/python3.12/site-packages/pyinstaller-*.dist-info/licenses/COPYING.txt dist/Panacea-Setup/licenses/PyInstaller.txt
          python3 scripts/package_native_setup.py
      - name: Test packaged wizard without host Tk
        run: |
          sudo apt-get remove -y python3-tk
          if /usr/bin/python3 -c 'import tkinter' 2>/dev/null; then exit 1; fi
          desktop-file-validate linux-setup/native/Panacea-Setup.desktop
          bash -n linux-setup/native/start-native.sh
          unzip -q dist/Panacea-DroidDeck-Native-Setup.zip -d build/native-test
          export PANACEA_SETUP_KIT="$PWD/build/native-test/Panacea-DroidDeck-Native-Setup"
          mkdir -p build/native-home
          export HOME="$PWD/build/native-home"
          xvfb-run -a bash "$PANACEA_SETUP_KIT/start-native.sh" --smoke-test
          cat "$HOME/.local/state/panacea-arm/native-start.log"
      - uses: actions/upload-artifact@v4
        with:
          name: Panacea-DroidDeck-Native-Setup
          if-no-files-found: error
          path: |
            dist/Panacea-DroidDeck-Native-Setup.zip
            dist/Panacea-DroidDeck-Native-Setup.sha256
